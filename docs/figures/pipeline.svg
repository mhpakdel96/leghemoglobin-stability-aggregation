  <text x="44" y="284" font-size="10.5" fill="#5f7185">RepairPDB  +  BuildModel</text>
  <text x="44" y="302" font-size="10.5" fill="#5f7185">6 variants, backbone unchanged</text>

  <rect x="312" y="244" width="252" height="78" rx="6" fill="#F7F8FA" stroke="#c3cdd8" stroke-width="1"/>
