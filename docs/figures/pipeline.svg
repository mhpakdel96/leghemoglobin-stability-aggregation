  <rect x="30" y="352" width="1100" height="74" rx="6" fill="#16202c"/>
  <text x="52" y="380" font-size="14" font-weight="700" fill="#ffffff">Production molecular dynamics</text>
  <text x="52" y="402" font-size="11.5" fill="#a8b8c8">GROMACS 2023.4   ·   13 systems  ×  3 independent replicates  ×  100 ns</text>
  <text x="1108" y="392" font-size="26" font-weight="700" fill="#ffffff" text-anchor="end">3.9 µs</text>
  <text x="1108" y="409" font-size="9.5" fill="#8899a8" text-anchor="end" letter-spacing="0.8">AGGREGATE SAMPLING</text>

  <line x1="580" y1="426" x2="580" y2="444" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M575 443 L585 443 L580 453 Z" fill="#8899a8"/>

  <rect x="30" y="456" width="1100" height="112" rx="6" fill="#FDF4F2" stroke="#D9A79E" stroke-width="1.2"/>
  <rect x="30" y="456" width="4.5" height="112" rx="2" fill="#B03A2E"/>
  <text x="52" y="479" font-size="12.5" font-weight="700" fill="#8E2E24">Quality control gate  —  artefacts detected, corrected, and documented</text>

  <text x="52" y="503" font-size="10.5" font-weight="700" fill="#8E2E24">Unrepaired chain break</text>
  <text x="52" y="520" font-size="10.5" fill="#7d5c56">C143–N144 = 18.30 Å in P. sativum</text>
  <text x="52" y="537" font-size="10.5" fill="#7d5c56">Scatter fell 28-fold on core restriction</text>

  <text x="420" y="503" font-size="10.5" font-weight="700" fill="#8E2E24">Disordered N-terminal tail</text>
  <text x="420" y="520" font-size="10.5" fill="#7d5c56">O. spinosa 1–13, pLDDT below 70, RMSF 18 Å</text>
  <text x="420" y="537" font-size="10.5" fill="#7d5c56">Analyses restricted to residues 9–165</text>

  <text x="800" y="503" font-size="10.5" font-weight="700" fill="#8E2E24">Alignment artefact</text>
  <text x="800" y="520" font-size="10.5" fill="#7d5c56">Species difference p = 1.3 × 10⁻⁵</text>
  <text x="800" y="537" font-size="10.5" fill="#7d5c56">Recomputed on core: p ≈ 0.73  →  withdrawn</text>

  <text x="52" y="558" font-size="10.5" fill="#7d5c56">Oxygen-bound systems set aside: heme and O₂ are harmonically restrained, and the distal histidine was built as HSD rather than HSE</text>

  <path d="M580 568 L580 586 L206 586 L206 604" fill="none" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M201 603 L211 603 L206 613 Z" fill="#8899a8"/>
