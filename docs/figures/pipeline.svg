  <rect x="30" y="856" width="1100" height="76" rx="6" fill="#F4F7FA" stroke="#4A6FA5" stroke-width="1.2"/>
  <rect x="30" y="856" width="4.5" height="76" rx="2" fill="#2B4A73"/>
  <text x="52" y="879" font-size="12.5" font-weight="700" fill="#2B4A73">Cross-validation  —  four independent methods, no contradictions</text>

  <text x="52" y="901" font-size="10.5" font-weight="700" fill="#2B4A73">SoluProt, sequence-based</text>
  <text x="52" y="918" font-size="10.5" fill="#4e6580">Trained on E. coli data; reproduces the sign of all six effects</text>

  <text x="440" y="901" font-size="10.5" font-weight="700" fill="#2B4A73">ΔΔG cross-check</text>
  <text x="440" y="918" font-size="10.5" fill="#4e6580">A4D internal vs standalone FoldX: max gap 0.118 kcal/mol</text>

  <text x="840" y="901" font-size="10.5" font-weight="700" fill="#2B4A73">pH scan 4.0–9.0</text>
  <text x="840" y="918" font-size="10.5" fill="#4e6580">Mutation effects are pH-independent</text>

  <line x1="580" y1="932" x2="580" y2="950" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M575 949 L585 949 L580 959 Z" fill="#8899a8"/>

  <rect x="30" y="962" width="546" height="62" rx="6" fill="#F2F7F3" stroke="#4A7C59" stroke-width="1.4"/>
  <text x="48" y="982" font-size="12.5" font-weight="700" fill="#2F5D42">P. sativum  →  V53T + V83T</text>
  <text x="48" y="1000" font-size="10.5" fill="#4a6a55">V83 was the top aggregation hotspot; now neutralised at zero stability cost</text>
  <text x="48" y="1016" font-size="10" fill="#6b8676">Keep expression in Pichia — the pH shift to E. coli costs more than the mutations gain</text>

  <rect x="584" y="962" width="546" height="62" rx="6" fill="#FBF4F0" stroke="#C1663D" stroke-width="1.4"/>
  <text x="602" y="982" font-size="12.5" font-weight="700" fill="#9B4A26">O. spinosa  →  F125W only</text>
  <text x="602" y="1000" font-size="10.5" fill="#8a5c42">The double mutant pays the full +1.91 kcal/mol penalty for no aggregation benefit</text>
  <text x="602" y="1016" font-size="10" fill="#a87a5e">L43W is detrimental on every measure and should be dropped</text>

