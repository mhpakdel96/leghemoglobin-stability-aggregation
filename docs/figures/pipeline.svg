  <text x="608" y="302" font-size="10.5" fill="#5f7185">0.15 M KCl  ·  298.15 K</text>

  <rect x="876" y="244" width="254" height="78" rx="6" fill="#F7F8FA" stroke="#c3cdd8" stroke-width="1"/>
