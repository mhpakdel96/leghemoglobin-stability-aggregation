<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 906" width="1160" height="906" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">


  <rect x="0" y="0" width="1160" height="906" rx="8" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>

  <!-- ══ HEADER ══ -->
  <text x="30" y="40" font-size="21" font-weight="700" fill="#16202c">Leghemoglobin Variant Assessment Pipeline</text>
  <text x="30" y="60" font-size="12.5" fill="#5f7185">Replicated molecular dynamics, folding free energy, and structure-based aggregation prediction across six engineered variants</text>
  <line x1="30" y1="72" x2="1130" y2="72" stroke="#e6ebf0" stroke-width="1"/>

  <!-- ══ STAGE 1 — INPUTS ══ -->
  <text x="30" y="98" font-size="10" font-weight="700" fill="#8899a8" letter-spacing="1.1">STRUCTURE SOURCES</text>

  <rect x="30" y="108" width="340" height="80" rx="6" fill="#EDF2F8" stroke="#4A6FA5" stroke-width="1.2"/>
  <text x="46" y="130" font-size="13" font-weight="700" fill="#2B4A73">AlphaFold  ·  Q9SAZ0</text>
  <text x="46" y="149" font-size="11.5" fill="#3d5875" font-style="italic">Pisum sativum</text>
  <text x="46" y="167" font-size="11" fill="#5f7185">146 residues   ·   mean pLDDT 95.9</text>

  <rect x="390" y="108" width="340" height="80" rx="6" fill="#EDF2F8" stroke="#4A6FA5" stroke-width="1.2"/>
  <text x="406" y="130" font-size="13" font-weight="700" fill="#2B4A73">AlphaFold  ·  A0A411AFI2</text>
  <text x="406" y="149" font-size="11.5" fill="#3d5875" font-style="italic">Ononis spinosa</text>
  <text x="406" y="167" font-size="11" fill="#5f7185">166 residues   ·   mean pLDDT 89.8</text>

  <rect x="750" y="108" width="380" height="80" rx="6" fill="#F5F1EA" stroke="#8B7355" stroke-width="1.2"/>
  <text x="766" y="130" font-size="13" font-weight="700" fill="#63513A">PDB  ·  1FSL   /   1GDJ</text>
  <text x="766" y="149" font-size="11.5" fill="#6d5c44">Soybean and yellow lupin leghemoglobin</text>
  <text x="766" y="167" font-size="11" fill="#7d6c55">Heme placement templates</text>

  <line x1="200" y1="188" x2="200" y2="206" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M195 205 L205 205 L200 215 Z" fill="#8899a8"/>
  <line x1="560" y1="188" x2="560" y2="206" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M555 205 L565 205 L560 215 Z" fill="#8899a8"/>
  <line x1="940" y1="188" x2="940" y2="206" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M935 205 L945 205 L940 215 Z" fill="#8899a8"/>

  <!-- ══ STAGE 2 — PREPARATION ══ -->
  <text x="30" y="234" font-size="10" font-weight="700" fill="#8899a8" letter-spacing="1.1">SYSTEM PREPARATION</text>

  <rect x="30" y="244" width="252" height="78" rx="6" fill="#F7F8FA" stroke="#c3cdd8" stroke-width="1"/>
  <text x="44" y="266" font-size="12" font-weight="700" fill="#16202c">FoldX 5.1</text>
  <text x="44" y="284" font-size="10.5" fill="#5f7185">RepairPDB  +  BuildModel</text>
  <text x="44" y="302" font-size="10.5" fill="#5f7185">6 variants, backbone unchanged</text>

  <rect x="312" y="244" width="252" height="78" rx="6" fill="#F7F8FA" stroke="#c3cdd8" stroke-width="1"/>
  <text x="326" y="266" font-size="12" font-weight="700" fill="#16202c">Heme transplant</text>
  <text x="326" y="284" font-size="10.5" fill="#5f7185">Superposition on 1FSL</text>
  <text x="326" y="302" font-size="10.5" fill="#5f7185">Common reference frame verified</text>

  <rect x="594" y="244" width="252" height="78" rx="6" fill="#F7F8FA" stroke="#c3cdd8" stroke-width="1"/>
  <text x="608" y="266" font-size="12" font-weight="700" fill="#16202c">CHARMM-GUI</text>
  <text x="608" y="284" font-size="10.5" fill="#5f7185">CHARMM36m  ·  TIP3P</text>
  <text x="608" y="302" font-size="10.5" fill="#5f7185">0.15 M KCl  ·  298.15 K</text>

  <rect x="876" y="244" width="254" height="78" rx="6" fill="#F7F8FA" stroke="#c3cdd8" stroke-width="1"/>
  <text x="890" y="266" font-size="12" font-weight="700" fill="#16202c">Topology repair</text>
  <text x="890" y="284" font-size="10.5" fill="#5f7185">ParmEd conversion</text>
  <text x="890" y="302" font-size="10.5" fill="#5f7185">Chain junction patches</text>

  <line x1="282" y1="283" x2="303" y2="283" stroke="#c3cdd8" stroke-width="1.6"/>
  <path d="M302 278 L302 288 L312 283 Z" fill="#c3cdd8"/>
  <line x1="564" y1="283" x2="585" y2="283" stroke="#c3cdd8" stroke-width="1.6"/>
  <path d="M584 278 L584 288 L594 283 Z" fill="#c3cdd8"/>
  <line x1="846" y1="283" x2="867" y2="283" stroke="#c3cdd8" stroke-width="1.6"/>
  <path d="M866 278 L866 288 L876 283 Z" fill="#c3cdd8"/>
  <line x1="580" y1="322" x2="580" y2="340" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M575 339 L585 339 L580 349 Z" fill="#8899a8"/>

  <!-- ══ STAGE 3 — SIMULATION ══ -->
  <rect x="30" y="352" width="1100" height="74" rx="6" fill="#16202c"/>
  <text x="52" y="380" font-size="14" font-weight="700" fill="#ffffff">Production molecular dynamics</text>
  <text x="52" y="402" font-size="11.5" fill="#a8b8c8">GROMACS 2023.4   ·   13 systems  ×  3 independent replicates  ×  100 ns</text>
  <text x="1108" y="392" font-size="26" font-weight="700" fill="#ffffff" text-anchor="end">3.9 µs</text>
  <text x="1108" y="409" font-size="9.5" fill="#8899a8" text-anchor="end" letter-spacing="0.8">AGGREGATE SAMPLING</text>

  <line x1="580" y1="426" x2="580" y2="444" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M575 443 L585 443 L580 453 Z" fill="#8899a8"/>

  <!-- ══ STAGE 4 — QUALITY CONTROL ══ -->
  <rect x="30" y="456" width="1100" height="92" rx="6" fill="#FDF4F2" stroke="#D9A79E" stroke-width="1.2"/>
  <rect x="30" y="456" width="4.5" height="92" rx="2" fill="#B03A2E"/>
  <text x="52" y="479" font-size="12.5" font-weight="700" fill="#8E2E24">Quality control gate  —  artefacts detected, corrected, and documented</text>

  <text x="52" y="503" font-size="10.5" font-weight="700" fill="#8E2E24">Unrepaired chain break</text>
  <text x="52" y="520" font-size="10.5" fill="#7d5c56">C143–N144 = 18.30 Å in P. sativum</text>
  <text x="52" y="537" font-size="10.5" fill="#7d5c56">Scatter fell 28-fold on core restriction</text>

  <text x="420" y="503" font-size="10.5" font-weight="700" fill="#8E2E24">Disordered N-terminal tail</text>
  <text x="420" y="520" font-size="10.5" fill="#7d5c56">O. spinosa 1–13, pLDDT below 70, RMSF 18 Å</text>
  <text x="420" y="537" font-size="10.5" fill="#7d5c56">Analyses restricted to residues 9–165</text>

  <text x="800" y="503" font-size="10.5" font-weight="700" fill="#8E2E24">Alignment artefact</text>
  <text x="800" y="520" font-size="10.5" fill="#7d5c56">Species difference p = 1.3 × 10⁻⁵</text>
  <text x="800" y="537" font-size="10.5" fill="#7d5c56">Recomputed on core: p ≈ 0.73  →  withdrawn</text>

  <path d="M580 548 L580 566 L206 566 L206 586" fill="none" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M201 585 L211 585 L206 595 Z" fill="#8899a8"/>
  <line x1="580" y1="548" x2="580" y2="586" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M575 585 L585 585 L580 595 Z" fill="#8899a8"/>
  <path d="M580 548 L580 566 L954 566 L954 586" fill="none" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M949 585 L959 585 L954 595 Z" fill="#8899a8"/>

  <!-- ══ STAGE 5 — THREE ANALYSES ══ -->
  <text x="30" y="588" font-size="10" font-weight="700" fill="#8899a8" letter-spacing="1.1">PARALLEL ASSESSMENT</text>

  <!-- Column 1 — structural -->
  <rect x="30" y="600" width="352" height="196" rx="6" fill="#ffffff" stroke="#B9AECD" stroke-width="1.2"/>
  <rect x="30" y="600" width="352" height="32" rx="6" fill="#6B5B95"/>
  <rect x="30" y="620" width="352" height="12" fill="#6B5B95"/>
  <text x="46" y="621" font-size="12" font-weight="700" fill="#ffffff">Structural stability  ·  MD</text>
  <text x="46" y="654" font-size="10.5" fill="#5f7185">Nine independent metrics on the</text>
  <text x="46" y="670" font-size="10.5" fill="#5f7185">structured core: RMSD, RMSF, Rg,</text>
  <text x="46" y="686" font-size="10.5" fill="#5f7185">SASA, H-bonds, helix content</text>
  <line x1="46" y1="700" x2="366" y2="700" stroke="#ece8f2" stroke-width="1"/>
  <text x="46" y="722" font-size="13" font-weight="700" fill="#4A3D6B">No significant effect</text>
  <text x="46" y="742" font-size="10.5" fill="#5f7185">2 of 54 comparisons below p = 0.05,</text>
  <text x="46" y="758" font-size="10.5" fill="#5f7185">against 2.7 expected by chance</text>
  <text x="46" y="780" font-size="10.5" fill="#8899a8">Helix content 79–81 % throughout</text>

  <!-- Column 2 — stability -->
  <rect x="404" y="600" width="352" height="196" rx="6" fill="#ffffff" stroke="#A7C4B0" stroke-width="1.2"/>
  <rect x="404" y="600" width="352" height="32" rx="6" fill="#4A7C59"/>
  <rect x="404" y="620" width="352" height="12" fill="#4A7C59"/>
  <text x="420" y="621" font-size="12" font-weight="700" fill="#ffffff">Folding free energy  ·  FoldX</text>
  <text x="420" y="654" font-size="10.5" fill="#5f7185">BuildModel, 5 runs per variant</text>
  <text x="420" y="670" font-size="10.5" fill="#5f7185">Positive ΔΔG = destabilising</text>
  <text x="420" y="686" font-size="10.5" fill="#5f7185">Method accuracy ≈ 0.5 kcal/mol</text>
  <line x1="420" y1="700" x2="740" y2="700" stroke="#e4efe7" stroke-width="1"/>
  <text x="420" y="722" font-size="11.5" font-weight="700" fill="#2F5D42">P. sativum   +0.004 to +0.102</text>
  <text x="420" y="739" font-size="10.5" fill="#5f7185">neutral — mutations are energetically free</text>
  <text x="420" y="762" font-size="11.5" font-weight="700" fill="#8E2E24">O. spinosa   L43W +1.42, double +1.91</text>
  <text x="420" y="779" font-size="10.5" fill="#5f7185">genuinely destabilising</text>

  <!-- Column 3 — aggregation -->
  <rect x="778" y="600" width="352" height="196" rx="6" fill="#ffffff" stroke="#E0B49B" stroke-width="1.2"/>
  <rect x="778" y="600" width="352" height="32" rx="6" fill="#C1663D"/>
  <rect x="778" y="620" width="352" height="12" fill="#C1663D"/>
  <text x="794" y="621" font-size="12" font-weight="700" fill="#ffffff">Aggregation  ·  Aggrescan4D</text>
  <text x="794" y="654" font-size="10.5" fill="#5f7185">pH 7.0, yeast cytosol, static mode</text>
  <text x="794" y="670" font-size="10.5" fill="#5f7185">Mutations applied server-side</text>
  <text x="794" y="686" font-size="10.5" fill="#5f7185">More negative = less aggregation-prone</text>
  <line x1="794" y1="700" x2="1114" y2="700" stroke="#f7e8df" stroke-width="1"/>
  <text x="794" y="722" font-size="11.5" font-weight="700" fill="#9B4A26">P. sativum   −2.40  /  −6.38  /  −8.78</text>
  <text x="794" y="739" font-size="10.5" fill="#5f7185">additive to three decimal places</text>
  <text x="794" y="762" font-size="11.5" font-weight="700" fill="#5f7185">O. spinosa   +0.38  /  −2.10  /  −0.07</text>
  <text x="794" y="779" font-size="10.5" fill="#5f7185">antagonistic: the double mutant cancels</text>

  <path d="M206 796 L206 818 L580 818 L580 832" fill="none" stroke="#8899a8" stroke-width="1.6"/>
  <line x1="580" y1="796" x2="580" y2="818" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M954 796 L954 818 L580 818 L580 832" fill="none" stroke="#8899a8" stroke-width="1.6"/>
  <path d="M575 831 L585 831 L580 841 Z" fill="#8899a8"/>

  <!-- ══ STAGE 6 — RECOMMENDATIONS ══ -->
  <rect x="30" y="844" width="546" height="46" rx="6" fill="#F2F7F3" stroke="#4A7C59" stroke-width="1.4"/>
  <text x="48" y="864" font-size="12.5" font-weight="700" fill="#2F5D42">P. sativum  →  V53T + V83T</text>
  <text x="48" y="880" font-size="10.5" fill="#4a6a55">V83 was the highest-scoring aggregation hotspot; now neutralised at zero stability cost</text>

  <rect x="584" y="844" width="546" height="46" rx="6" fill="#FBF4F0" stroke="#C1663D" stroke-width="1.4"/>
  <text x="602" y="864" font-size="12.5" font-weight="700" fill="#9B4A26">O. spinosa  →  F125W only</text>
  <text x="602" y="880" font-size="10.5" fill="#8a5c42">The double mutant pays the full +1.91 kcal/mol penalty for no aggregation benefit</text>

</svg>
