  <path d="M949 603 L959 603 L954 613 Z" fill="#8899a8"/>

  <text x="30" y="606" font-size="10" font-weight="700" fill="#8899a8" letter-spacing="1.1">PARALLEL ASSESSMENT</text>

  <rect x="30" y="618" width="352" height="196" rx="6" fill="#ffffff" stroke="#B9AECD" stroke-width="1.2"/>
  <rect x="30" y="618" width="352" height="32" rx="6" fill="#6B5B95"/>
  <rect x="30" y="638" width="352" height="12" fill="#6B5B95"/>
  <text x="46" y="639" font-size="12" font-weight="700" fill="#ffffff">Structural stability  ·  MD</text>
  <text x="46" y="672" font-size="10.5" fill="#5f7185">Nine independent metrics on the</text>
  <text x="46" y="688" font-size="10.5" fill="#5f7185">structured core: RMSD, RMSF, Rg,</text>
  <text x="46" y="704" font-size="10.5" fill="#5f7185">SASA, H-bonds, helix content</text>
  <line x1="46" y1="718" x2="366" y2="718" stroke="#ece8f2" stroke-width="1"/>
  <text x="46" y="740" font-size="13" font-weight="700" fill="#4A3D6B">No significant effect</text>
  <text x="46" y="760" font-size="10.5" fill="#5f7185">2 of 54 comparisons below p = 0.05,</text>
  <text x="46" y="776" font-size="10.5" fill="#5f7185">against 2.7 expected by chance</text>
  <text x="46" y="798" font-size="10.5" fill="#8899a8">Helix content 79–81 % throughout</text>

  <rect x="404" y="618" width="352" height="196" rx="6" fill="#ffffff" stroke="#A7C4B0" stroke-width="1.2"/>
  <rect x="404" y="618" width="352" height="32" rx="6" fill="#4A7C59"/>
  <rect x="404" y="638" width="352" height="12" fill="#4A7C59"/>
  <text x="420" y="639" font-size="12" font-weight="700" fill="#ffffff">Folding free energy  ·  FoldX</text>
  <text x="420" y="672" font-size="10.5" fill="#5f7185">BuildModel, 5 runs per variant</text>
  <text x="420" y="688" font-size="10.5" fill="#5f7185">Positive ΔΔG = destabilising</text>
  <text x="420" y="704" font-size="10.5" fill="#5f7185">Method accuracy ≈ 0.5 kcal/mol</text>
  <line x1="420" y1="718" x2="740" y2="718" stroke="#e4efe7" stroke-width="1"/>
  <text x="420" y="740" font-size="11.5" font-weight="700" fill="#2F5D42">P. sativum   +0.004 to +0.102</text>
  <text x="420" y="757" font-size="10.5" fill="#5f7185">neutral — mutations are energetically free</text>
  <text x="420" y="780" font-size="11.5" font-weight="700" fill="#8E2E24">O. spinosa   L43W +1.42, double +1.91</text>
  <text x="420" y="797" font-size="10.5" fill="#5f7185">genuinely destabilising</text>

  <rect x="778" y="618" width="352" height="196" rx="6" fill="#ffffff" stroke="#E0B49B" stroke-width="1.2"/>
  <rect x="778" y="618" width="352" height="32" rx="6" fill="#C1663D"/>
  <rect x="778" y="638" width="352" height="12" fill="#C1663D"/>
  <text x="794" y="639" font-size="12" font-weight="700" fill="#ffffff">Aggregation  ·  Aggrescan4D</text>
  <text x="794" y="672" font-size="10.5" fill="#5f7185">pH 7.0 yeast cytosol, plus a 4.0–9.0 scan</text>
  <text x="794" y="688" font-size="10.5" fill="#5f7185">Mutations applied server-side</text>
  <text x="794" y="704" font-size="10.5" fill="#5f7185">More negative = less aggregation-prone</text>
  <line x1="794" y1="718" x2="1114" y2="718" stroke="#f7e8df" stroke-width="1"/>
  <text x="794" y="740" font-size="11.5" font-weight="700" fill="#9B4A26">P. sativum   −2.40  /  −6.38  /  −8.78</text>
  <text x="794" y="757" font-size="10.5" fill="#5f7185">additive to three decimal places</text>
  <text x="794" y="780" font-size="11.5" font-weight="700" fill="#5f7185">O. spinosa   +0.38  /  −2.10  /  −0.07</text>
  <text x="794" y="797" font-size="10.5" fill="#5f7185">antagonistic: the double mutant cancels</text>

  <path d="M206 814 L206 830 L580 830 L580 844" fill="none" stroke="#8899a8" stroke-width="1.6"/>
  <line x1="580" y1="814" x2="580" y2="830" stroke="#8899a8" stroke-width="1.6"/>
